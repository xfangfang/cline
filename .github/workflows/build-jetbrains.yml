# GitHub Actions Workflow for building and verifying the Cline JetBrains plugin.
# Based on the JetBrains IntelliJ Platform Plugin Template:
# https://github.com/JetBrains/intellij-platform-plugin-template
#
# Steps:
# - Build the plugin with `./gradlew buildPlugin`
# - Run plugin verification with `./gradlew verifyPlugin`
# - Upload the built plugin ZIP as an artifact

name: Build JetBrains Plugin

on:
    workflow_dispatch:
    push:
        branches:
            - "copilot/**"
            - "fork/**"
        paths:
            - "jetbrains/**"
            - ".github/workflows/build-jetbrains.yml"
    pull_request:
        paths:
            - "jetbrains/**"
            - ".github/workflows/build-jetbrains.yml"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    # Build the plugin and upload the artifact
    build:
        name: Build
        runs-on: ubuntu-latest

        steps:
            # Free GitHub Actions Environment Disk Space
            - name: Maximize Build Space
              uses: jlumbroso/free-disk-space@v1.3.1
              with:
                  tool-cache: false
                  large-packages: false

            - name: Fetch Sources
              uses: actions/checkout@v4

            # Set up Java 21 (required by IntelliJ Platform Gradle Plugin)
            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: 21

            # Setup Gradle with caching
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            # Build the plugin
            - name: Build Plugin
              working-directory: jetbrains
              run: ./gradlew buildPlugin

            # Prepare plugin artifact for upload
            - name: Prepare Plugin Artifact
              id: artifact
              shell: bash
              working-directory: jetbrains
              run: |
                  cd build/distributions
                  FILENAME=$(ls *.zip)
                  unzip "$FILENAME" -d content
                  echo "filename=${FILENAME:0:-4}" >> $GITHUB_OUTPUT

            # Upload the built plugin ZIP
            - name: Upload Plugin Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.artifact.outputs.filename }}
                  path: jetbrains/build/distributions/content/*/*
                  retention-days: 30

    # Run plugin structural verification
    verify:
        name: Verify Plugin
        needs: [build]
        runs-on: ubuntu-latest

        steps:
            - name: Maximize Build Space
              uses: jlumbroso/free-disk-space@v1.3.1
              with:
                  tool-cache: false
                  large-packages: false

            - name: Fetch Sources
              uses: actions/checkout@v4

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: 21

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  cache-read-only: true

            # Run IntelliJ Plugin Verifier
            - name: Run Plugin Verification
              working-directory: jetbrains
              run: ./gradlew verifyPlugin

            # Collect Plugin Verifier results
            - name: Collect Plugin Verifier Result
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: pluginVerifier-result
                  path: jetbrains/build/reports/pluginVerifier
