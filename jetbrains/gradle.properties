pluginGroup = bot.cline
pluginName = Cline
pluginRepositoryUrl = https://github.com/cline/cline
pluginVersion = 3.80.0

# IntelliJ Platform target version
# https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 243
pluginUntilBuild = 251.*

# IntelliJ Platform version used for building the plugin.
# Check available versions at https://www.jetbrains.com/intellij-repository/releases
platformVersion = 2024.3

# Gradle Wrapper version
gradleVersion = 9.4.1

# Opt-out flag for bundling Kotlin standard library
# https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
